<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibePilot  decentralized marketing autopilot</title>
  <meta name="description" content="Own your data. Post everywhere. No surveillance, just results.">
  <link rel="icon" href="/app/icons/icon-192.png">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <style>
    html,body{margin:0;background:#0b0314;color:#e8e0f5;font-family:Segoe UI,Inter,system-ui,Roboto,Arial}
    .wrap{max-width:960px;margin:12vh auto;padding:0 24px;text-align:center}
    h1{font-weight:800;letter-spacing:.2px;margin-bottom:6px}
    .sub{color:#b8a8da;margin-top:0}
    .cta{display:inline-block;margin-top:24px;padding:14px 22px;border-radius:14px;background:#6c3bbf;color:#fff;text-decoration:none}
    .cta:active{transform:translateY(1px)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:32px}
    .card{background:#150824;border:1px solid #2a0f4a;border-radius:16px;padding:16px;color:#cfc4e8}
    footer{opacity:.7;margin-top:48px;font-size:12px;color:#b8a8da}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>VibePilot</h1>
    <p class="sub">The decentralized, data-collection-free marketing autopilot for small business.</p>

    <div class="grid">
      <div class="card">Never-repeat captions & prompts</div>
      <div class="card">Industry packs & vibe sliders</div>
      <div class="card">Own your media in your Storj bucket</div>
      <div class="card">Simple calendar scheduling</div>
    </div>

    <a class="cta" href="/app/">Open App</a>

    <footer> <span id="y"></span> VibePilot</footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
